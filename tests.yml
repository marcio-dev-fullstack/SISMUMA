# Nome do Workflow
name: PHP CI

# --- Gatilhos (Triggers) ---
# Este workflow é acionado a cada push em um pull request direcionado à branch 'main'.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# Jobs
jobs:
  # Job de Setup: Prepara o ambiente e instala as dependências uma única vez.
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Upload vendor directory
        uses: actions/upload-artifact@v4
        with:
          name: vendor-dependencies
          path: vendor

  test:
    name: Run Unit Tests
    needs: setup # Depende do job de setup
    runs-on: ubuntu-latest

    # Etapa 1: Configurar o Serviço de Banco de Dados
    # Inicia um contêiner de serviço com o banco de dados PostGIS.
    # Os testes serão executados contra este banco de dados temporário.
    services:
      db:
        image: postgis/postgis:16-3.4-alpine
        # Variáveis de ambiente para o banco de dados de teste.
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Opções para garantir que o banco de dados esteja pronto antes dos testes começarem.
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Etapa 2: Checkout do Código
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Download vendor dependencies
        uses: actions/download-artifact@v4
        with:
          name: vendor-dependencies
          path: vendor

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, bcmath, pcntl, zip, gd # Extensões do seu Dockerfile
          coverage: none # Desabilita a geração de cobertura, que não está sendo usada

      # Etapa 6: Preparar a Aplicação
      - name: Copy .env
        run: cp .env.example .env
      - name: Generate application key
        run: php artisan key:generate

      # Etapa 7: Executar os Testes
      - name: Run PHPUnit tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.db.ports[5432] }}
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password

  lint:
    name: Run Code Style Check (Pint)
    needs: setup # Depende do job de setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Download vendor dependencies
        uses: actions/download-artifact@v4
        with:
          name: vendor-dependencies
          path: vendor

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  security:
    name: Run Static Analysis (PHPStan)
    needs: setup # Depende do job de setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Download vendor dependencies
        uses: actions/download-artifact@v4
        with:
          name: vendor-dependencies
          path: vendor

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Run PHPStan Security Scan
        # O --no-progress e --error-format=github fazem a saída ser bem integrada com o GitHub Actions
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=github
